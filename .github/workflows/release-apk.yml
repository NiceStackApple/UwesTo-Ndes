name: Build & Release UwesTo APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis (contoh: v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=UwesTo Debug,O=UwesTo,C=ID"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build UwesTo APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK & release tag
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          APK_NAME="UwesTo-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=${APK_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_meta.outputs.apk_name }}
          path: ${{ steps.release_meta.outputs.apk_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "UwesTo ${{ steps.release_meta.outputs.tag }}"
          body: |
            ## UwesTo (${{ steps.release_meta.outputs.tag }})
            Aplikasi Android penghitung scroll Reels & Shorts live berbahasa Indonesia khas Semarang Timur.

            ### Cara Pasang APK
            1. Download file **${{ steps.release_meta.outputs.apk_name }}** di bagian **Assets** di bawah.
            2. Buka file APK di HP Android dan izinkan pemasangan dari sumber ini jika diminta.
            3. Buka **UwesTo**, aktifkan izin **Accessibility Service** & **Overlay** (atau coba langsung lewat **Mode Uji Coba**).
          files: ${{ steps.release_meta.outputs.apk_name }}
          make_latest: true
